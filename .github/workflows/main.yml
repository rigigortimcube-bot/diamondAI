name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Fix libtinfo5
      run: |
        wget https://mirrors.edge.kernel.org/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb

    - name: Create static folder
      run: |
        mkdir -p static
        if [ -f index.html ]; then mv index.html static/index.html; fi
        if [ -f logo.png ]; then mv logo.png static/logo.png; fi

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build APK
      run: |
        pip install buildozer cython
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
        echo "[app]" > buildozer.spec
        echo "title = diamondAI" >> buildozer.spec
        echo "package.name = com.diamond.ai" >> buildozer.spec
        echo "package.domain = org.test" >> buildozer.spec
        echo "source.dir = ." >> buildozer.spec
        echo "source.include_exts = py,png,jpg,kv,atlas,html,js,css" >> buildozer.spec
        echo "version = 1.0" >> buildozer.spec
        echo "requirements = python3,flask" >> buildozer.spec
        echo "android.permissions = INTERNET" >> buildozer.spec
        echo "android.api = 33" >> buildozer.spec
        echo "android.minapi = 21" >> buildozer.spec
        echo "android.archs = arm64-v8a" >> buildozer.spec
        echo "android.accept_sdk_license = True" >> buildozer.spec
        buildozer android debug

    - uses: actions/upload-artifact@v4
      with:
        name: diamondAI-APK
        path: bin/*.apk
